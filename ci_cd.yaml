name: CI/CD Pipeline

# 1. Define your Triggers (Events)
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # --- CI PHASE ---
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # Speeds up subsequent runs

      - name: Install Dependencies
        run: npm ci

      - name: Run Linters
        run: npm run lint --if-present

      - name: Run Tests
        run: npm test

  # --- CD PHASE ---
  deploy:
    name: Deploy to Production
    needs: test-and-lint # Prevents deployment if tests fail
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # Only deploy on main branch merges
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4


name: CI/CD Demo File
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
jobs:
    job-1:
        runs-on: ubuntu-latest
        steps:
            - name: step 1
              run: echo "step -1 job" 
            - name: step 2
              run: echo "step-2 job running"
    job-2:
        runs-on: windows-latest
        steps:
            - name: step 3 
              shell: cmd
              run: echo Hello from classic Command Prompt!
    job-3:
        runs-on: ubuntu-latest
        steps:
            - name: check system details
              run: | 
                nproc
                echo $USER
                free -h
                df -h
                

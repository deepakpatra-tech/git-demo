name: output in GHA test Workflow
on:
    workflow_dispatch
jobs:
    job1:
        runs-on: ubuntu-latest
        steps:
            - name: api version create
              id: api-version
              run: echo "version=1.0.1" >> $GITHUB_OUTPUT

            - name: show version
              run: echo "the api version is ${{ steps.api-version.outputs.version }}"
name: CI and Docker Deploy
on:
    push:
        branches:
            - main
jobs:
    checkout-code:
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: action/checkout@v6
        - name: build docker image
          run: docker build -t deepakpatra-tech/my-app:v1 .
        - name: Test Application
          run: curl http://127.0.0.1:5001/

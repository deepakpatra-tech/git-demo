name: CI and Docker Deploy
on:
    push:
        branches:
            - main
jobs:
    checkout-code:
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v7
        - name: build docker image
          run: docker build -t deepakpatra-tech/my-app:v1 .
        - name: Run Conatiner
          run: docker run -d -p 5000:5000 deepakpatra-tech/my-app:v1
        - name: Test Application
          run: |
            sleep 5
            curl http://127.0.0.1:5000

name: Deploy App

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Where should we deploy?"
        required: true
        type: choice
        options:
          - dev
          - production
      smoke-test:
        description: "Do you want perfomr smoke test"
        required: true
        type: boolean


jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Show environment
        run: echo "Deploying to ${{ inputs.environment }}"
      - name: Run it when smoke test is true
        if: ${{ inputs.smoke-test }}
        run: echo " smoke test perfomed"
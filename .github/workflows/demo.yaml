name: CI Workflow
on:
  push:
    branches:
      - main
    paths-ignore:  # if cnages happend into README.md and push to main,	don't run the workflow
      - README.md

  pull_request:
    branches:
      - main
jobs:
  Job-1:
    runs-on: ubuntu-latest
    steps:
      - name: running echo
        run: echo "event was:${{ github.event_name}} "
  Job-2:
    runs-on: ubuntu-latest
    needs: Job-1
    steps:
      - name: print message
        run: echo 'HI'
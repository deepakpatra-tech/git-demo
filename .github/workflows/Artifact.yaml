name: Artifact POC Workflow
on:
  workflow_dispatch:
    inputs:
      smoke-test:
        description: 'do you perform smoke-test'
        required: true
        type: boolean
jobs:
  Check-Code:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v7
      - name: list all files
        run: ls
      - name: setup python
        uses: actions/setup-python@v5
        with: 
          python-version: '3.13'

      - name: install dependenices
        run: pip install --no-cache-dir -r requirements.txt

      - name: run application
        run: |
          python app.py &
          sleep 5

      - name: smoke test
        if: ${{ inputs.smoke-test }}
        run: curl http://127.0.0.1:5000

      - name: create artifact dir
        run: | 
          mkdir -p artifact/
          cp app.py artifact/
          cp requirements.txt artifact/

      - name: upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-artifact-flask
          path: artifact/
  deploy:
    runs-on: ubuntu-latest
    needs: Check-Code
    steps:
      - name: download artifact
        uses: actions/download-artifact@v8
        with:
          name: build-artifact-flask
          path: artifact/
      - name: check files
        run: |
          cat app.py
          




